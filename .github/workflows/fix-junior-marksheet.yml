name: Fix junior marksheet

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch junior marks fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/src/pages/ClassMarksheetV2.tsx')
          s = p.read_text()
          old = '''{getResultForSubject(r,str(s.id)).find((x:Row)=>/\\bSC\\b|SCHOOL|WRITTEN|STRUCTURED/i.test(`${str(x.exams?.exam_type)} ${str(x.exams?.name)}`.toUpperCase()))?.score ?? ""}'''
          new = '''{getResultForSubject(r,str(s.id)).find((x:Row)=>/\\bSC\\b|SCHOOL|WRITTEN|STRUCTURED/i.test(`${str(x.exams?.exam_type)} ${str(x.exams?.name)}`.toUpperCase()))?.score ?? resultMark(r,str(s.id))}'''
          if old not in s:
              raise SystemExit('Expected junior marks cell was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/ClassMarksheetV2.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: show persisted junior marks in marksheet'
          git push