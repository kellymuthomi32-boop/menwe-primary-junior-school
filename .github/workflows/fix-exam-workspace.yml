name: Fix exam workspace schema

on:
  push:
    paths:
      - .github/workflows/fix-exam-workspace.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix class_subjects query
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/src/pages/ExamPublishingWorkspace.tsx')
          s = p.read_text()
          old = 'db.from("class_subjects").select("id,class_id,subject_id")'
          new = 'db.from("class_subjects").select("class_id,subject_id")'
          if old not in s:
              raise SystemExit('Expected broken query was not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/ExamPublishingWorkspace.tsx
          git commit -m "Fix examination workspace class subject query"
          git push
