name: Fix marks display
on:
  push:
    paths:
      - '.github/workflows/fix-marks-display.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch marksheet
        shell: python
        run: |
          from pathlib import Path
          p = Path('client/src/pages/ClassMarksheetV2.tsx')
          s = p.read_text()
          old = '''function getResultForSubject(row: Row, subjectId: string) {
  const target = str(subjectId);
  return (row.results ?? []).filter((r: Row) => str(r.subject_id) === target);
}'''
          new = '''function getResultForSubject(row: Row, subjectId: string) {
  const target = str(subjectId);
  const subject = (row.results ?? []).find((r: Row) => str(r.subject_id) === target)?.subjects;
  const code = str(subject?.code).toUpperCase();
  return (row.results ?? []).filter((r: Row) =>
    str(r.subject_id) === target ||
    (!!code && str(r.subjects?.code).toUpperCase() === code)
  );
}'''
          if old not in s:
            raise SystemExit('subject helper not found')
          s = s.replace(old, new, 1)
          old2 = '''<td className="border p-2 text-center">{getResultForSubject(r,str(s.id)).find((x:Row)=>/\\bSC\\b|SCHOOL|WRITTEN|STRUCTURED/i.test(`${str(x.exams?.exam_type)} ${str(x.exams?.name)}`.toUpperCase()))?.score ?? ""}</td><td className="border p-2 text-center">{getResultForSubject(r,str(s.id)).find((x:Row)=>/\\bL\\b|LISTENING|ORAL|LANGUAGE/i.test(`${str(x.exams?.exam_type)} ${str(x.exams?.name)}`.toUpperCase()))?.score ?? ""}</td>'''
          new2 = '''<td className="border p-2 text-center">{(() => { const results = getResultForSubject(r,str(s.id)); const sc = results.find((x:Row)=>/\\bSC\\b|SCHOOL|WRITTEN|STRUCTURED/i.test(`${str(x.exams?.exam_type)} ${str(x.exams?.name)}`.toUpperCase())); return sc?.score ?? (results.length === 1 ? results[0].score : ""); })()}</td><td className="border p-2 text-center">{getResultForSubject(r,str(s.id)).find((x:Row)=>/\\bL\\b|LISTENING|ORAL|LANGUAGE/i.test(`${str(x.exams?.exam_type)} ${str(x.exams?.name)}`.toUpperCase()))?.score ?? ""}</td>'''
          if old2 not in s:
            raise SystemExit('junior score cells not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/ClassMarksheetV2.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: display persisted junior marks"
          git push