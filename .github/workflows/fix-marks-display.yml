name: Fix marks display
on:
  push:
    paths:
      - '.github/workflows/fix-marks-display.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch marksheet score display
        shell: python
        run: |
          from pathlib import Path
          p = Path('client/src/pages/ClassMarksheetV2.tsx')
          s = p.read_text()
          old = 'return raw == null ? "—" : max && max > 0 ? `${fmt(raw)}/${fmt(max)}` : `${fmt(raw)}%`;'
          new = 'return raw == null ? "—" : `${fmt(raw)}`;'
          if old not in s:
            raise SystemExit('marks display line not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/ClassMarksheetV2.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: show marks without maximum score suffix"
          git push
