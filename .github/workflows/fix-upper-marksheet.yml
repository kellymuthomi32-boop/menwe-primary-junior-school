name: Fix upper primary marksheet subject grouping

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-upper-marksheet.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Correct marksheet filter
        run: |
          python -c 'from pathlib import Path; p=Path("client/src/pages/ClassMarksheetV2.tsx"); t=p.read_text(); old=r"\\n      const enteredSubjectIds"; new="\\n      const enteredSubjectIds"; assert old in t, "literal newline escape not found"; p.write_text(t.replace(old,new,1))'

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/ClassMarksheetV2.tsx
          git diff --cached --quiet || git commit -m "Correct upper marksheet filter syntax"
          git push origin main
