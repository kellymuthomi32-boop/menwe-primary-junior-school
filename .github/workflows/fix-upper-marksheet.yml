name: Fix upper primary marksheet subject grouping

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-upper-marksheet.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair upper primary marksheet subject loading
        shell: python
        run: |
          from pathlib import Path

          p = Path("client/src/pages/ClassMarksheetV2.tsx")
          t = p.read_text()

          # Repair the previous accidental literal escape if it is still present.
          t = t.replace(r"\\n      const enteredSubjectIds", "\n      const enteredSubjectIds")

          # Query the two persisted CBC subjects even if a stale class_subjects
          # mapping is missing them, then keep every subject that actually has
          # results available to the display/grouping logic.
          old = '      const subjectIds = selectedSubjects.map(s => str(s.id)).filter(Boolean);'
          new = '''      const reportSubjects = allSubjects.filter(s => selectedSubjects.some(x => str(x.id) === str(s.id)) || /^(Creative Arts and Sports|Integrated Science)$/i.test(str(s.name)));
      const subjectIds = reportSubjects.map(s => str(s.id)).filter(Boolean);'''
          if old in t:
              t = t.replace(old, new, 1)

          old_set = '      setSubjects(selectedSubjects.filter((s) => enteredSubjectIds.has(str(s.id))));'
          if old_set in t:
              t = t.replace(old_set, '      setSubjects(allSubjects.filter((s) => enteredSubjectIds.has(str(s.id))));', 1)

          # Upper Primary uses synthetic CBC columns. Direct persisted subjects
          # must supply their own IDs; otherwise percentageFor() sees an empty
          # component list and displays blanks even though marks exist.
          old_science = '      if (subjects.some(INT_SCI) || subjects.some(s => matches(s, [/INTEGRATED SCIENCE/]))) out.push({ id: "__int_sci__", code: "INT SCI", name: "Integrated Science", synthetic: true, componentIds: subjects.filter(INT_SCI).map(s => s.id) });'
          new_science = '''      const directScience = subjects.find(s => matches(s, [/INTEGRATED SCIENCE/, /SCIENCE TECHNOLOGY/, /^SCI\\b/]));
      const scienceComponents = subjects.filter(INT_SCI);
      if (directScience) out.push({ ...directScience, code: "INT SCI", synthetic: false });
      else if (scienceComponents.length) out.push({ id: "__int_sci__", code: "INT SCI", name: "Integrated Science", synthetic: true, componentIds: scienceComponents.map(s => s.id) });'''
          if old_science in t:
              t = t.replace(old_science, new_science, 1)

          old_cas = '      if (subjects.some(CAS) || subjects.some(s => matches(s, [/CREATIVE ARTS.*SPORT/]))) out.push({ id: "__cas__", code: "CAS", name: "Creative Arts & Sports", synthetic: true, componentIds: subjects.filter(CAS).map(s => s.id) });'
          new_cas = '''      const directCas = subjects.find(s => matches(s, [/CREATIVE ARTS.*SPORT/]));
      const casComponents = subjects.filter(CAS);
      if (directCas) out.push({ ...directCas, code: "CAS", synthetic: false });
      else if (casComponents.length) out.push({ id: "__cas__", code: "CAS", name: "Creative Arts & Sports", synthetic: true, componentIds: casComponents.map(s => s.id) });'''
          if old_cas in t:
              t = t.replace(old_cas, new_cas, 1)

          p.write_text(t)

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/ClassMarksheetV2.tsx
          if git diff --cached --quiet; then
            echo "No marksheet changes required"
            exit 0
          fi
          git commit -m "fix: display upper primary Creative Arts and Integrated Science marks"
          git push origin main
