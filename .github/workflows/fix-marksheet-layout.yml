name: Fix marksheet and report-card data visibility

on:
  push:
    paths:
      - .github/workflows/fix-marksheet-layout.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch report-card result visibility
        shell: python
        run: |
          from pathlib import Path
          path = Path('client/src/pages/ReportCardsDirectory.tsx')
          text = path.read_text()

          marker = 'const {user,profile}=useSchoolAuth(); const admin=ADMINS.includes(profile?.role??"");'
          replacement = 'const {user,profile}=useSchoolAuth(); const admin=ADMINS.includes(profile?.role??""); const canUseEnteredResults=admin||profile?.role==="TEACHER";'
          if marker in text and 'canUseEnteredResults=' not in text:
              text = text.replace(marker, replacement, 1)

          text = text.replace('.eq("exams.status","PUBLISHED")', '')
          status_filter = '.in("exams.status",canUseEnteredResults?["DRAFT","PUBLISHED"]:["PUBLISHED"])'
          marker = '.eq("exams.class_id",classId).in("subject_id"'
          text = text.replace(marker, '.eq("exams.class_id",classId)' + status_filter + '.in("subject_id"')
          text = text.replace('No published result', 'No recorded result')
          text = text.replace('No published results were found for this learner in the selected period.', 'No recorded results were found for this learner in the selected period.')
          text = text.replace('This report reflects published assessment results for the selected academic period.', 'This report reflects recorded assessment results for the selected academic period.')
          path.write_text(text)

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/ReportCardsDirectory.tsx
          if git diff --cached --quiet; then
            echo "No report-card changes required"
            exit 0
          fi
          git commit -m "fix: show entered staff marks while protecting family reports"
          git push
