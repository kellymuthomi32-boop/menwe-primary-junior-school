name: Menwe Portal CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menwe-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_1g1alo1Y6SmQYvqVSYIc1bZ2
  VERCEL_PROJECT_ID: prj_CCg6KLLU609xDrvSdB2jno0KjF2i

jobs:
  code-check:
    name: Code & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript verification
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  supabase-deploy:
    name: Supabase Migrations & Edge Functions
    runs-on: ubuntu-latest
    needs: code-check
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply database migrations
        run: supabase db push

      - name: Deploy parent-assistant Edge Function
        run: supabase functions deploy parent-assistant --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy communication-webhook Edge Function
        run: supabase functions deploy communication-webhook --project-ref "$SUPABASE_PROJECT_ID"

  vercel-deploy:
    name: Clean Production Vercel Deployment
    runs-on: ubuntu-latest
    needs: supabase-deploy
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript verification before release
        run: npx tsc --noEmit

      - name: Clean Vercel production deployment
        run: npx vercel@latest --prod --yes --force --token "$VERCEL_TOKEN"

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: vercel-deploy
    steps:
      - name: Confirm release
        run: |
          echo "============================================================"
          echo " MENWE PRIMARY & JUNIOR SCHOOL - RELEASE SUCCESSFUL"
          echo "============================================================"
          echo "Commit: ${GITHUB_SHA}"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo ""
          echo "✓ TypeScript verification passed"
          echo "✓ Production build passed"
          echo "✓ Supabase migrations applied"
          echo "✓ parent-assistant deployed"
          echo "✓ communication-webhook deployed"
          echo "✓ Vercel production deployment completed with --force"
          echo "✓ Vercel build cache bypassed for this release"
          echo ""
          echo "Production: https://menwe-primary-junior-school.vercel.app"
          echo "============================================================"
