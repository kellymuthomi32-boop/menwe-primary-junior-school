name: Menwe Portal CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menwe-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_1g1alo1Y6SmQYvqVSYIc1bZ2
  VERCEL_PROJECT_ID: prj_CCg6KLLU609xDrvSdB2jno0KjF2i

jobs:
  code-check:
    name: Code & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript verification
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  supabase-deploy:
    name: Supabase Migrations & Edge Functions
    runs-on: ubuntu-latest
    needs: code-check
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply database migrations
        run: supabase db push

      - name: Deploy parent-assistant Edge Function
        run: supabase functions deploy parent-assistant --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy communication-webhook Edge Function
        run: supabase functions deploy communication-webhook --project-ref "$SUPABASE_PROJECT_ID"

  vercel-deploy:
    name: Clean Production Vercel Deployment
    runs-on: ubuntu-latest
    needs: supabase-deploy
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript verification before release
        run: npx tsc --noEmit

      - name: Clean Vercel production deployment
        run: |
          npx vercel@latest --prod --yes --force \
            --meta githubCommitSha="$GITHUB_SHA" \
            --token "$VERCEL_TOKEN"

      - name: Verify Live Production Deployment SHA
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_DOMAIN: menwe-primary-junior-school.vercel.app
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " VERIFYING LIVE VERCEL PRODUCTION DEPLOYMENT"
          echo "============================================================"

          DEPLOYMENT_JSON="$({
            curl --fail-with-body -sS \
              --get \
              "https://api.vercel.com/v6/deployments" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              --data-urlencode "projectId=$VERCEL_PROJECT_ID" \
              --data-urlencode "target=production" \
              --data-urlencode "limit=20"
          })"

          DEPLOYMENT_ID="$({
            echo "$DEPLOYMENT_JSON" |
              jq -r --arg sha "$EXPECTED_SHA" '
                .deployments[]
                | select(.meta.githubCommitSha == $sha)
                | .uid
              ' |
              head -n 1
          })"

          if [ -z "$DEPLOYMENT_ID" ] || [ "$DEPLOYMENT_ID" = "null" ]; then
            echo "ERROR: No Vercel production deployment matches $EXPECTED_SHA"
            echo "Recent production deployments:"
            echo "$DEPLOYMENT_JSON" | jq -r '
              .deployments[] |
              [.uid, .readyState, (.meta.githubCommitSha // "unknown"), (.url // "unknown")] | @tsv
            '
            exit 1
          fi

          EXACT_DEPLOYMENT="$({
            curl --fail-with-body -sS \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN"
          })"

          LIVE_SHA="$(echo "$EXACT_DEPLOYMENT" | jq -r '.meta.githubCommitSha // empty')"
          LIVE_STATE="$(echo "$EXACT_DEPLOYMENT" | jq -r '.readyState // empty')"
          LIVE_URL="$(echo "$EXACT_DEPLOYMENT" | jq -r '.url // empty')"

          echo "Deployment ID:  $DEPLOYMENT_ID"
          echo "Vercel State:   $LIVE_STATE"
          echo "Vercel Git SHA: $LIVE_SHA"
          echo "Expected SHA:   $EXPECTED_SHA"
          echo "Deployment URL: $LIVE_URL"

          if [ "$LIVE_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Vercel SHA mismatch."
            exit 1
          fi

          if [ "$LIVE_STATE" != "READY" ]; then
            echo "ERROR: Vercel deployment is not READY: $LIVE_STATE"
            exit 1
          fi

          HTTP_STATUS="$(
            curl -sS -o /dev/null -w "%{http_code}" \
              --max-time 30 \
              "https://$PRODUCTION_DOMAIN"
          )"

          echo "Production HTTP status: $HTTP_STATUS"

          case "$HTTP_STATUS" in
            2*|3*) ;;
            *)
              echo "ERROR: Production hostname returned HTTP $HTTP_STATUS"
              exit 1
              ;;
          esac

          echo "============================================================"
          echo " LIVE PRODUCTION DEPLOYMENT VERIFIED"
          echo "============================================================"
          echo "✓ GitHub SHA:      $EXPECTED_SHA"
          echo "✓ Vercel SHA:      $LIVE_SHA"
          echo "✓ Vercel state:    READY"
          echo "✓ Production host: $PRODUCTION_DOMAIN"
          echo "✓ HTTP status:     $HTTP_STATUS"
          echo "============================================================"

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: vercel-deploy
    steps:
      - name: Confirm release
        run: |
          echo "============================================================"
          echo " MENWE PRIMARY & JUNIOR SCHOOL - RELEASE SUCCESSFUL"
          echo "============================================================"
          echo "Commit: ${GITHUB_SHA}"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo ""
          echo "✓ TypeScript verification passed"
          echo "✓ Production build passed"
          echo "✓ Supabase migrations applied"
          echo "✓ parent-assistant deployed"
          echo "✓ communication-webhook deployed"
          echo "✓ Vercel production deployment completed with --force"
          echo "✓ Live Vercel SHA verified"
          echo "✓ Production hostname verified"
          echo ""
          echo "Production: https://menwe-primary-junior-school.vercel.app"
          echo "============================================================"
