name: Upgrade Apex mathematics workspace

on:
  push:
    branches: [fix/apex-mathematics-workspace]

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[apex-math-upgrade]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Mathematics workspace upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------- Frontend: dedicated Mathematics working area ----------
          p = Path('client/src/components/ParentAssistant.tsx')
          s = p.read_text()

          s = s.replace(
              'type ApexRole = "parent" | "teacher" | "institution";\n',
              'type ApexRole = "parent" | "teacher" | "institution";\n'\n              'type ApexSubjectMode = "general" | "mathematics";\n'\n              'type MathLevel = "auto" | "1-3" | "4-6" | "7-9";\n',
              1,
          )

          s = s.replace(
              'const [apexRole, setApexRole] = useState<ApexRole | null>(null);',
              'const [apexRole, setApexRole] = useState<ApexRole | null>(null);\n'
              '  const [subjectMode, setSubjectMode] = useState<ApexSubjectMode>("general");\n'
              '  const [mathLevel, setMathLevel] = useState<MathLevel>("auto");',
              1,
          )

          s = s.replace(
              'body: JSON.stringify({ messages: nextMessages.slice(-10) }),',
              'body: JSON.stringify({ messages: nextMessages.slice(-10), subject_mode: subjectMode, math_level: mathLevel }),',
              1,
          )

          s = s.replace(
              '<div className="min-w-0 flex-1"><p className="text-[10px] font-bold uppercase tracking-[0.16em] text-[#D89B28]">Menwe Apex V2</p><h2 className="truncate text-sm font-bold">{apexRole ? roleLabel[apexRole] : "Secure Academic Intelligence"}</h2></div>',
              '<div className="min-w-0 flex-1"><p className="text-[10px] font-bold uppercase tracking-[0.16em] text-[#D89B28]">Menwe Apex V2</p><h2 className="truncate text-sm font-bold">{subjectMode === "mathematics" ? "Mathematics Workspace" : apexRole ? roleLabel[apexRole] : "Secure Academic Intelligence"}</h2></div>',
              1,
          )

          toolbar = '''\n            <div className="shrink-0 border-b border-slate-200 bg-white px-3 py-2.5 sm:px-4">\n              <div className="flex flex-wrap items-center gap-2">\n                <div className="flex rounded-xl bg-slate-100 p-1">\n                  <button type="button" onClick={() => setSubjectMode("general")} className={`rounded-lg px-3 py-1.5 text-[11px] font-bold transition ${subjectMode === "general" ? "bg-[#061229] text-white shadow-sm" : "text-slate-500 hover:text-[#061229]"}`}>General</button>\n                  <button type="button" onClick={() => setSubjectMode("mathematics")} className={`rounded-lg px-3 py-1.5 text-[11px] font-bold transition ${subjectMode === "mathematics" ? "bg-[#D89B28] text-[#061229] shadow-sm" : "text-slate-500 hover:text-[#061229]"}`}>Mathematics</button>\n                </div>\n                {subjectMode === "mathematics" && <label className="ml-auto flex items-center gap-2 text-[10px] font-bold uppercase tracking-wider text-slate-400">Level\n                  <select value={mathLevel} onChange={(e) => setMathLevel(e.target.value as MathLevel)} className="rounded-lg border border-slate-200 bg-white px-2 py-1.5 text-[11px] font-bold normal-case tracking-normal text-[#061229] outline-none focus:border-[#D89B28]">\n                    <option value="auto">Auto</option><option value="1-3">Grades 1–3</option><option value="4-6">Grades 4–6</option><option value="7-9">Grades 7–9</option>\n                  </select>\n                </label>}\n              </div>\n              {subjectMode === "mathematics" && <div className="mt-2 flex gap-2 overflow-x-auto pb-0.5">\n                {[\n                  ["Solve step-by-step", "Solve this Mathematics problem step-by-step and show all working."],\n                  ["Explain a concept", "Explain this Mathematics concept simply, then give one worked example."],\n                  ["Create practice", "Create 5 Mathematics practice questions at this level, then provide answers separately."],\n                  ["Check my working", "Check my Mathematics working. Find the first incorrect step, explain why it is wrong, and show the corrected step."],\n                ].map(([label, prompt]) => <button key={label} type="button" onClick={() => setInput(prompt)} className="shrink-0 rounded-full border border-[#D89B28]/35 bg-[#D89B28]/8 px-3 py-1.5 text-[10px] font-bold text-[#061229] transition hover:-translate-y-0.5 hover:border-[#D89B28]">{label}</button>)}\n              </div>}\n            </div>\n'''

          s = s.replace(
              '<div className="flex min-h-0 flex-1 flex-col bg-slate-50">\n            <div className="flex-1 overflow-y-auto px-3 py-4 sm:px-4">',
              '<div className="flex min-h-0 flex-1 flex-col bg-slate-50">' + toolbar + '            <div className="flex-1 overflow-y-auto px-3 py-4 sm:px-4">',
              1,
          )

          s = s.replace(
              'placeholder="Ask Menwe Apex…"',
              'placeholder={subjectMode === "mathematics" ? "Enter a Mathematics problem or ask for working…" : "Ask Menwe Apex…"}',
              1,
          )

          p.write_text(s)

          # ---------- Backend: Mathematics-specialist reasoning policy ----------
          p = Path('supabase/functions/apex-engine/index.ts')
          s = p.read_text()

          math_policy = '''\n\nconst MATHEMATICS_POLICY = [\n  "MATHEMATICS WORKSPACE:",\n  "- Treat this as a dedicated Mathematics working area, not a general chat response.",\n  "- Use Kenyan CBC Mathematics language and adapt the explanation to the requested grade/level.",\n  "- Prefer this structure when appropriate: Problem → Given/Find → Method/Formula → Step-by-step working → Answer → Check/Verification.",\n  "- Never jump from the question to the final answer when working is requested. Show every meaningful calculation and preserve equality signs correctly.",\n  "- Arithmetic: recompute important results independently; show carrying/borrowing, place value, regrouping, and estimation where useful.",\n  "- Fractions: identify common denominators, show equivalent fractions, simplify the final result, and distinguish proper/improper/mixed fractions.",\n  "- Decimals, percentages, ratio and proportion: show conversions and the relationship between quantities before calculating.",\n  "- Algebra: collect like terms carefully, show each transformation on both sides, and substitute the final value back to verify when possible.",\n  "- Geometry and mensuration: state the formula, substitute values, calculate, and include correct units. For diagrams, describe labels, angles, lengths, scale and construction clearly.",\n  "- Statistics and probability: show the data used, formula, substitution and interpretation. For graphs, state axes, scale, coordinates and plotted points explicitly.",\n  "- Word problems: extract known information, identify what is required, choose the operation/formula, solve, then interpret the answer in context.",\n  "- Grades 1-3: concrete and visual language. Grades 4-6: structured multi-step working. Grades 7-9: formal notation, algebraic reasoning and verification.",\n  "- If the learner gives an attempted solution, diagnose the first incorrect step before giving the corrected working.",\n  "- If a full solution is not requested, offer a hint first. If full working is requested, provide it fully.",\n  "- Use Kenyan examples such as KSh, metres, litres, kilograms and school situations when helpful, but never invent school records.",\n  "- When a specific CBC strand or sub-strand is requested, use the verified curriculum lookup tool rather than guessing.",\n  "- Do not claim calculator or graph output you did not actually compute; show transparent working that the learner can reproduce.",\n].join("\\n");\n'''

          if 'const MATHEMATICS_POLICY' not in s:
              s = s.replace('\nfunction audit(event: string', math_policy + '\nfunction audit(event: string', 1)

          old_parse = '''    const rawMessages = Array.isArray(body.messages) ? body.messages : [];\n    const messages = rawMessages'''
          new_parse = '''    const subjectMode = body.subject_mode === "mathematics" ? "mathematics" : "general";\n    const allowedMathLevels = new Set(["auto", "1-3", "4-6", "7-9"]);\n    const mathLevel = allowedMathLevels.has(String(body.math_level)) ? String(body.math_level) : "auto";\n    const rawMessages = Array.isArray(body.messages) ? body.messages : [];\n    const messages = rawMessages'''
          if old_parse in s and 'const subjectMode = body.subject_mode' not in s:
              s = s.replace(old_parse, new_parse, 1)

          old_current = '''    const current: any[] = [{ role: "system", content: SYSTEM_POLICY + "\\n\\nCURRENT SERVER-VERIFIED ROLE: " + role.toUpperCase() + ". The server, not the user, determines this role and tool boundary." }, ...messages];'''
          new_current = '''    const subjectPolicy = subjectMode === "mathematics" ? MATHEMATICS_POLICY + "\\n\\nREQUESTED MATHEMATICS LEVEL: " + mathLevel : "";\n    const current: any[] = [{ role: "system", content: SYSTEM_POLICY + "\\n\\n" + subjectPolicy + "\\n\\nCURRENT SERVER-VERIFIED ROLE: " + role.toUpperCase() + ". The server, not the user, determines this role and tool boundary." }, ...messages];'''
          if old_current in s:
              s = s.replace(old_current, new_current, 1)

          s = s.replace(
              'max_tokens: 900,',
              'max_tokens: subjectMode === "mathematics" ? 1400 : 900,',
              1,
          )
          p.write_text(s)
          PY

      - name: Verify changes
        run: |
          grep -q 'Mathematics Workspace' client/src/components/ParentAssistant.tsx
          grep -q 'MATHEMATICS_POLICY' supabase/functions/apex-engine/index.ts

      - name: Commit upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/upgrade-apex-math-workspace.yml
          git add client/src/components/ParentAssistant.tsx supabase/functions/apex-engine/index.ts .github/workflows/upgrade-apex-math-workspace.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Upgrade Apex mathematics workspace [apex-math-upgrade]'
          git push origin HEAD:fix/apex-mathematics-workspace
