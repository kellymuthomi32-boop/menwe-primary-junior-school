    <script>
      // Non-critical public discovery enhancement. Delay it until the browser
      // is idle so it never competes with React hydration/first paint.
      window.addEventListener("load", function () {
        var run = function () { var s = document.createElement("script"); s.src = "/public-discovery.js"; s.defer = true; document.body.appendChild(s); };

      }, { once: true });
